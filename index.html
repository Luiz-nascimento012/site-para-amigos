<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>integra ofertas</title>
    <script src="https://kit.fontawesome.com/af97999266.js" crossorigin="anonymous"></script>
      <link rel="stylesheet" href="estilos/main.css" media="all">
      <link rel="stylesheet" href="estilos/responsividade.css">
</head>
<body>
    <header>
        <h1>Teste muito irado para algo de mercado</h1>
    </header>
    <main>
        <section class="valor">
            <h2>Digite aqui o quanto você tem de dinheiro:</h2>
            <input type="number" name="dinheiro" id="idin">
        </section>


        <details class="comp">
            <summary>
            produtos
            </summary>
            <ul>
            </ul>
        </details>


        <section class="mercado">
            <div class="title">
                <h2>COMPRAS</h2>
            </div>

            <div class="produtos">
                <div class="produto">
                    <div class="info">
                        <h3>Arroz</h3>
                        <p>R$<span class="custo">3,99</span></p>
                    </div>
                    <div class="buttons">
                        <button type="button" class="rem">
                            <p><i class="fa-solid fa-minus"></i></p>
                        </button>

                        <span class="quantidade">0</span>

                        <button type="button" class="add">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button type="button" class="addicionar">Adicionar a sacola</button>
                    </div>
                </div>
                <div class="produto">
                    <div class="info">
                        <h3>Pinta</h3>
                        <p>R$<span class="custo">19,99</span></p>
                    </div>
                    <div class="buttons">
                        <button type="button" class="rem">
                            <p><i class="fa-solid fa-minus"></i></p>
                        </button>

                        <span class="quantidade">0</span>

                        <button type="button" class="add">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button type="button" class="addicionar">Adicionar a sacola</button>
                    </div>
                </div>
                <div class="produto">
                    <div class="info">
                        <h3>Café</h3>
                        <p>R$<span class="custo">12,99</span></p>
                    </div>
                    <div class="buttons">
                        <button type="button" class="rem">
                            <p><i class="fa-solid fa-minus"></i></p>
                        </button>

                        <span class="quantidade">0</span>

                        <button type="button" class="add">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <button type="button" class="addicionar">Adicionar a sacola</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
